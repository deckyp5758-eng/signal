name: Build & Release Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ScalpSignal APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p build_output
          cp app/build/outputs/apk/debug/app-debug.apk build_output/ScalpSignal-Latest.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScalpSignal-APK
          path: build_output/ScalpSignal-Latest.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: build_output/ScalpSignal-Latest.apk
          tag_name: ${{ github.ref_name || 'latest' }}
          name: "ScalpSignal App Release ${{ github.ref_name || 'v1.0' }}"
          body: |
            ## 🚀 ScalpSignal Android APK Update
            
            Unduh dan instal langsung file APK di bawah ini di HP Android Anda:
            - **File**: `ScalpSignal-Latest.apk`
            - **Build Date**: ${{ github.event.head_commit.timestamp || 'Latest' }}
            - **Commit**: `${{ github.sha }}`
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
