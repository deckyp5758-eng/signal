name: Build & Release Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ScalpSignal APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.11.1'

      - name: Setup Build Environment & Keystore
        run: |
          touch .env .env.example
          if [ ! -f debug.keystore ]; then
            echo "Creating debug keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Ensure Gradle Wrapper Exists
        run: |
          if [ ! -f gradlew ]; then
            echo "Generating Gradle Wrapper..."
            gradle wrapper --gradle-version 8.11.1 --distribution-type bin
          fi
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Rename APK
        run: |
          mkdir -p build_output
          cp app/build/outputs/apk/debug/app-debug.apk build_output/ScalpSignal-Latest.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScalpSignal-APK
          path: build_output/ScalpSignal-Latest.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build_output/ScalpSignal-Latest.apk
          tag_name: latest
          name: "ScalpSignal App - Latest Build #${{ github.run_number }}"
          body: |
            ## 🚀 ScalpSignal Android APK Update
            
            Unduh dan instal langsung file APK di bawah ini di HP Android Anda:
            - 📱 **File**: `ScalpSignal-Latest.apk`
            - ⏱️ **Build**: #${{ github.run_number }}
            - 🏷️ **Commit**: `${{ github.sha }}`
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
